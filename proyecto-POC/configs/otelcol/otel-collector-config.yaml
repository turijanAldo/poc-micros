receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug: {}

  zipkin:
    endpoint: "http://zipkin:9411/api/v2/spans"

  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

processors:
  batch: {}
  memory_limiter:
    limit_mib: 200
    spike_limit_mib: 20
    check_interval: 1s
  resource:
    attributes:
      - key: service.name
        value: unknown_service
        action: insert
      - key: deployment.environment
        value: development
        action: upsert

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug, zipkin, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug, prometheus]

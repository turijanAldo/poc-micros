plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.4'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}
ext {
    openTelemetryVersion = '2.18.1'
    micrometerTracingVersion = '1.4.0'
}
dependencies {
    	// Lombok
	compileOnly 'org.projectlombok:lombok'  // Lombok solo se usa en compilación, no se incluye en el JAR final
    annotationProcessor 'org.projectlombok:lombok' // Procesa las anotaciones de Lombok (@Getter, @Setter, @Builder, etc.) en tiempo de compilación.
    
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    // gRPC
    implementation 'io.grpc:grpc-netty-shaded:1.63.0'
    implementation 'io.grpc:grpc-protobuf:1.63.0'
    implementation 'io.grpc:grpc-stub:1.63.0'
    
    // Protobuf
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    
    // Anotaciones para @Generated - CAMBIAR A JAVAX
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
	        // ===== NUEVAS DEPENDENCIAS OPENTELEMETRY =====
    // Actuator para métricas
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // OpenTelemetry Tracing - MÍNIMO NECESARIO
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    // Prometheus para métricas - MÍNIMO
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // Para logs estructurados (opcional por ahora)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'net.devh:grpc-server-spring-boot-starter:3.0.0.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0' // Use the latest stable version

	// herramientas para desarrollo -- opcional
	// developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// MariaDB driver
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// Para pruebas
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


}
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.63.0"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

tasks.named('test') {
	useJUnitPlatform()
}

spring:
  application:
    name: micros1
  datasource:
    url: jdbc:mariadb://localhost:3306/solicitudes_db
    username: root
    password: root
    # Add connection pool settings for debugging
    hikari:
      connection-timeout: 20000
      initialization-fail-timeout: 0
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true  # Enable SQL logging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        show_sql: true

server:
  port: 8084

grpc:
  server:
    port: 9095
    security:
      enabled: false

# Enhanced logging configuration
logging:
  level:
    root: INFO
    com.company: DEBUG
    org.springframework: DEBUG
    org.springframework.boot: DEBUG
    org.springframework.context: DEBUG
    org.springframework.beans: DEBUG
    org.hibernate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    net.devh.boot.grpc: DEBUG
    io.grpc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/monitor.log
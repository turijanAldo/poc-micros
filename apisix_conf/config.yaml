apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_listen:
    ip: 0.0.0.0
    port: 9180

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0          # Para desarrollo - cambiar en producción
      - 127.0.0.0/24       # Localhost
      - 172.16.0.0/12      # Docker networks
      - 192.168.0.0/16     # Private networks
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

etcd:
  host:
    - "http://etcd:2379"
  prefix: "/apisix"
  timeout: 30

nginx_config:
  error_log: "/dev/stderr"
  error_log_level: "warn"
  worker_processes: "auto"
  worker_rlimit_nofile: 20480
  worker_connections: 10620
  http:
    access_log: "/dev/stdout"
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    send_timeout: 10s
    underscores_in_headers: "on"
    real_ip_header: "X-Real-IP"
    real_ip_from:
      - 127.0.0.1
      - 'unix:'

plugins:
  - real-ip
  - cors
  - proxy-rewrite
  - basic-auth
  - key-auth
  - jwt-auth
  - api-breaker
  - limit-req
  - limit-conn
  - limit-count
  - proxy-cache
  - proxy-mirror
  - traffic-split
  - redirect
  - response-rewrite
  - prometheus
  - echo
  - http-logger
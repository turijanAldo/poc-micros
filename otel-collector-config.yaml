# otel-collector-config.yaml
# Configuración central del hub de observabilidad para sistemas distribuidos

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: service.name
        value: default-service
        action: insert   # Solo agrega si el micro no envía nombre
      - key: service.version
        value: "1.0.0"
        action: upsert   # Actualiza o agrega versión
      - key: deployment.environment
        value: "development"
        action: upsert
      - key: team
        value: "backend"
        action: upsert
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 256

exporters:
  zipkin:
    endpoint: "http://zipkin:9411/api/v2/spans"
    format: json
  prometheus:
    endpoint: "0.0.0.0:8889"
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [zipkin, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, logging]
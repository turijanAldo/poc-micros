# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN PRINCIPAL DEL SERVICE-GATEWAY
# ═══════════════════════════════════════════════════════════════

spring:
  application:
    name: service-gateway
  
  webflux:
    multipart:
      max-in-memory-size: 1MB

server:
  port: 8082
  tomcat:
    connection-timeout: 20000ms
    keep-alive-timeout: 15000ms

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN DEL CLIENTE gRPC
# ═══════════════════════════════════════════════════════════════
grpc:
  client:
    user-service:
      address: 'static://localhost:9090'
      negotiationType: plaintext
      deadline: 10s
      retry: true
      max-inbound-message-size: 1MB
      keep-alive-time: 30s
      keep-alive-timeout: 5s

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE OBSERVABILIDAD (Micrometer + OTEL)
# ═══════════════════════════════════════════════════════════════
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: 
        - B3
        - B3_MULTI
        - W3C
    baggage:
      correlation:
        enabled: true
        fields:
          - user-id
          - request-id
          - operation-type
          - session-id
      remote-fields:
        - user-id
        - request-id
        - operation-type
        - session-id
  
  # Configuración limpia y unificada para OTLP
  otlp:
    tracing:
      endpoint: http://host.docker.internal:4318/v1/traces

  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,env,configprops,threaddump

  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      version: "1.0.0"
      environment: "development"
      team: "backend"
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
        http.client.requests: 0.5, 0.75, 0.95, 0.99
      sla:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s
        http.client.requests: 50ms, 100ms, 200ms, 500ms, 1s
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: 10s

# ═══════════════════════════════════════════════════════════════
# ATRIBUTOS DE RECURSO OTEL
# ═══════════════════════════════════════════════════════════════
otel:
  resource:
    attributes: 
      service.name: service-gateway
      service.version: "1.0.0"
      deployment.environment: "development"
      team: "backend"
  exporter:
    otlp:
      endpoint: http://host.docker.internal:4318/v1/traces
      protocol: http
# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE LOGGING CON TRACEID Y SPANID
# ═══════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.web: INFO
    io.micrometer: INFO
    io.zipkin: INFO
    brave: INFO
    org.springframework.web.reactive.function.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: ./logs/service-gateway.log
    max-size: 100MB
    max-history: 30

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE TU APP PERSONALIZADA
# ═══════════════════════════════════════════════════════════════
app:
  service-user:
    base-url: http://localhost:8081
    timeout:
      connect: 2s
      read: 5s
      write: 5s
  circuit-breaker:
    enabled: false
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s

# ═══════════════════════════════════════════════════════════════
# INFORMACIÓN DE LA APP
# ═══════════════════════════════════════════════════════════════
info:
  app:
    name: ${spring.application.name}
    description: "Service Gateway con observabilidad completa - Jaeger, Zipkin y Prometheus"
    version: "1.0.0"
    team: "Backend Team"
    contact:
      email: "backend@empresa.com"
  build:
    artifact: "service-gateway"
    version: "1.0.0"
    timestamp: "2025-08-11"
  features:
    - "Spring Boot Actuator"
    - "Micrometer Metrics"
    - "Prometheus Integration"
    - "Jaeger & Zipkin Distributed Tracing"
    - "Custom Business Metrics"
    - "Request Correlation"

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Versiones de OpenTelemetry compatibles con Spring Boot 3.5.4
ext {
    openTelemetryVersion = '2.18.1'
    micrometerTracingVersion = '1.4.0'
}

dependencies {
    // gRPC
    implementation 'io.grpc:grpc-netty-shaded:1.63.0'
    implementation 'io.grpc:grpc-protobuf:1.63.0'
    implementation 'io.grpc:grpc-stub:1.63.0'
    
    // Protobuf
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    
    // Anotaciones para @Generated - CAMBIAR A JAVAX
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    
    // Spring Boot
    implementation 'net.devh:grpc-server-spring-boot-starter:3.0.0.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-web'
        // ===== NUEVAS DEPENDENCIAS OPENTELEMETRY =====
    // Actuator para métricas
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // OpenTelemetry Tracing - MÍNIMO NECESARIO
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
    
    // Prometheus para métricas - MÍNIMO
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // Para logs estructurados (opcional por ahora)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    
    // ===== TEST =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.63.0"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Tarea para descargar el agente OpenTelemetry
task downloadOtelAgent {
    group = 'setup'
    description = 'Descarga el agente OpenTelemetry Java'
    
    def agentFile = file('opentelemetry-javaagent.jar')
    def agentUrl = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v${openTelemetryVersion}/opentelemetry-javaagent.jar"
    
    doLast {
        if (!agentFile.exists()) {
            println "Descargando agente OpenTelemetry..."
            ant.get(src: agentUrl, dest: agentFile.absolutePath)
            println "✅ Agente descargado: ${agentFile.absolutePath}"
        } else {
            println "✅ Agente ya existe: ${agentFile.absolutePath}"
        }
    }
}
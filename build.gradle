plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ═══════════════════════════════════════════════════════════════
    // DEPENDENCIAS PRINCIPALES DE SPRING BOOT
    // ═══════════════════════════════════════════════════════════════
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // ═══════════════════════════════════════════════════════════════
    // ACTUATOR PARA MÉTRICAS Y HEALTH CHECKS
    // ═══════════════════════════════════════════════════════════════
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ═══════════════════════════════════════════════════════════════
    // MICROMETER TRACING - NUEVA API DE SPRING BOOT 3
    // ═══════════════════════════════════════════════════════════════
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    // ═══════════════════════════════════════════════════════════════
    // PROMETHEUS PARA MÉTRICAS
    // ═══════════════════════════════════════════════════════════════
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ═══════════════════════════════════════════════════════════════
    // LOGGING ESTRUCTURADO
    // ═══════════════════════════════════════════════════════════════
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // ═══════════════════════════════════════════════════════════════
    // DEPENDENCIAS DE GRPC Y PROTOBUF
    // ═══════════════════════════════════════════════════════════════
    implementation 'com.google.protobuf:protobuf-java:3.25.1'
    runtimeOnly 'net.devh:grpc-client-spring-boot-starter:3.0.0.RELEASE'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-netty-shaded:1.62.2'

    // ✅ CORRECCIÓN: Añadido javax.annotation para Java 21
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // ═══════════════════════════════════════════════════════════════
    // DEPENDENCIAS DE TESTING
    // ═══════════════════════════════════════════════════════════════
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.1"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.62.2"
        }
    }
    generateProtoTasks {
        all()*.builtins {
            java {}
        }
        all()*.plugins {
            grpc {}
        }
    }
}

// Incluye los directorios generados en el sourceSet
sourceSets {
    main {
        java {
            srcDirs += [
                "$buildDir/generated/source/proto/main/java",
                "$buildDir/generated/source/proto/main/grpc"
            ]
        }
    }
}

// Asegurar que la generación de proto se ejecute antes de la compilación
compileJava.dependsOn generateProto

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named('generateProto')
}

// ═══════════════════════════════════════════════════════════════
// Configuración adicional de JAR
// ═══════════════════════════════════════════════════════════════
jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().toString(),
            'Built-JDK': System.getProperty('java.version')
        )
    }
}

// Tarea de verificación opcional
task checkObservabilityDependencies {
    group = 'verification'
    description = 'Verifica que todas las dependencias de observabilidad estén disponibles'

    doLast {
        println "🔍 Verificando dependencias de observabilidad..."
        def requiredClasses = [
            'io.micrometer.tracing.Tracer': 'Micrometer Tracing API',
            'io.micrometer.tracing.Span': 'Micrometer Span API',
            'io.micrometer.core.instrument.MeterRegistry': 'Micrometer Core',
            'io.opentelemetry.exporter.zipkin.ZipkinSpanExporter': 'Zipkin Exporter',
            'io.micrometer.core.instrument.Counter': 'Micrometer Counter'
        ]

        requiredClasses.each { className, description ->
            try {
                Class.forName(className)
                println "✅ $description: $className"
            } catch (ClassNotFoundException e) {
                println "❌ FALTA: $description: $className"
            }
        }

        println "🎯 Verificación de dependencias completada"
    }
}

build.dependsOn checkObservabilityDependencies